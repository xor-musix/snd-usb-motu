# Example modprobe configuration for snd-usb-motu
# Place this file in /etc/modprobe.d/snd-usb-motu.conf
#
# All parameters are read-only at runtime - they are fixed at module load time.

# Default configuration (48 kHz sample rate)
# options snd-usb-motu sample_rate=48000

# Low-latency configuration
# Options: uframes_per_urb=64 pb_safety_offset=4 rec_safety_offset=4 bpf_factor=16
# options snd-usb-motu sample_rate=48000 uframes_per_urb=64 pb_safety_offset=4 rec_safety_offset=4 bpf_factor=16

# High sample rate (96 kHz)
# options snd-usb-motu sample_rate=96000

# Custom card ID and index
# options snd-usb-motu id=motu_pro index=0

# Disable auto-restart (for testing/debugging)
# options snd-usb-motu auto_restart=N

# Enable test hooks (for hardware testing)
# options snd-usb-motu test_hooks=Y

# Use CFC scheduling explicitly
# options snd-usb-motu use_cfc=1
